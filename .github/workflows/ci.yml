name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test the checker on the example apps
        run: |
          python skills/soc2-compliance-check/scripts/soc2_check.py examples/compliant-app --fail-on warn
          python skills/soc2-compliance-check/scripts/soc2_check.py examples/noncompliant-app --fail-on never
